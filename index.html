<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 - 橫向滾動版</title>
  
  <!-- 引入外部 CSS 樣式表 -->
  <link rel="stylesheet" href="style.css">
  
  <!-- 引入外部 JavaScript 檔案 (defer 確保網頁載入後才執行) -->
  <script src="script.js" defer></script>
</head>
<body>

  <!-- ======================================= -->
  <!-- 🧭 頂部導覽列 -->
  <!-- ======================================= -->
  <nav class="fixed-nav">
    <a href="#category-branding">品牌視覺設計</a>
    <a href="#category-packaging">包裝設計</a>
  </nav>

  <!-- ======================================= -->
  <!-- 📐 橫向滾動主容器 (所有作品必須直接放在此層) -->
  <!-- ======================================= -->
  <main class="horizontal-scroll-container">

    <!-- 
      
      🗂️ 分類一：品牌視覺設計 (Brand Visual Design)
      
    -->
    
    <!-- 分類標題區 -->
    <header class="category-header panel" id="category-branding">
      <div class="title-group">
        <h1>品牌視覺設計</h1>
        <span class="subtitle">Brand Visual Design</span>
      </div>
      <p class="category-desc"></p>
    </header>

    <!-- 滿版封面介紹圖 -->
    <!-- 加上 cover-brand -->
<div class="panel full-image-panel theme-dragon-fruit cover-brand" aria-label="嚼淨 品牌視覺設計" role="img"></div>
    
    <!-- 🖼️ 品牌視覺設計 - 作品圖片區 -->
    <!-- (如需新增，請複製下方單一 section 區塊) -->
    
    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-04.png" alt="品牌視覺設計 04"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-05.png" alt="品牌視覺設計 05"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-08.png" alt="品牌視覺設計 08"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-06.png" alt="品牌視覺設計 06"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-07.png" alt="品牌視覺設計 07"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-09.png" alt="品牌視覺設計 09"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-16.png" alt="品牌視覺設計 16"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-10.png" alt="品牌視覺設計 10"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-11.png" alt="品牌視覺設計 11"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-14.png" alt="品牌視覺設計 14"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-12.png" alt="品牌視覺設計 12"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-15.png" alt="品牌視覺設計 15"></div>
    </section>

    <section class="project-gallery panel panel-image theme-dragon-fruit">
      <div class="mock-image"><img src="0627-13.png" alt="品牌視覺設計 13"></div>
    </section>


    <!-- 
      
      🗂️ 分類二：包裝設計 (Packaging Design)
      
    -->

    <!-- 分類標題區 -->
    <header class="category-header panel" id="category-packaging">
      <div class="title-group">
        <h1>包裝設計</h1>
        <span class="subtitle">Packaging Design</span>
      </div>
      <p class="category-desc"></p>
    </header>

    <!-- 滿版封面介紹圖 -->
    <!-- 加上 cover-packaging -->
<div class="panel full-image-panel theme-dragon-fruit cover-packaging" aria-label="四季 包裝設計" role="img"></div>

    <!-- 🖼️ 包裝設計 - 作品圖片區 -->
    <section class="project-gallery panel panel-image theme-dark-tech">
      <div class="mock-image"><img src="0627-01.png" alt="包裝設計 01"></div>
    </section>
    
    <section class="project-gallery panel panel-image theme-dark-tech">
      <div class="mock-image"><img src="0627-02.png" alt="包裝設計 02"></div>
    </section>

  </main>
</body>
</html>
